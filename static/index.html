<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="系统随机接入一位高风险客户。十二轮对话，你能不能让客户停下来。">
  <title>AI 反诈劝阻</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
<main class="app-shell" aria-label="AI 反诈劝阻训练">
  <section class="screen on assignment" id="assignment" aria-live="polite">
    <div class="osbar"><span>14:47</span><span class="os-signals" aria-hidden="true"><i></i><i></i><i></i><b></b></span></div>
    <div class="assignment-main">
      <div class="assignment-visual" aria-hidden="true">
        <span class="radar-ring radar-ring-outer"></span>
        <span class="radar-ring radar-ring-inner"></span>
        <span class="radar-core"></span>
        <span class="radar-sweep"></span>
      </div>
      <div class="assignment-copy">
        <p class="live-label"><i></i>正在接入高风险客户</p>
        <h1 id="assignmentTitle">一条异常记录<br>刚刚进入队列。</h1>
        <p id="assignmentCopy">系统正在整理账户异动信息。客户由系统随机分配，本局开始后不会更换。</p>
        <div class="assignment-progress" id="assignmentProgress"><i></i></div>
        <button class="retry-start" id="retryStart" type="button" hidden>重新连接</button>
      </div>
    </div>
  </section>

  <section class="screen opening" id="opening">
    <div class="osbar"><span>14:47</span><span class="os-signals" aria-hidden="true"><i></i><i></i><i></i><b></b></span></div>
    <header class="appbar">
      <div class="brand"><span class="brandmark" aria-hidden="true">李</span>客户风险协作</div>
      <span class="quiet">今日 1 / 3</span>
    </header>
    <main class="opening-body">
      <p class="live-label"><i></i><span id="openingAlert">资金异动 · 等待处理</span></p>
      <span class="opening-rule" aria-hidden="true"></span>
      <h1 id="openingTitle"></h1>
      <p class="opening-lead" id="openingLead"></p>
      <dl class="opening-record">
        <dt>本次异常金额</dt>
        <dd class="num" id="openingMoney"></dd>
        <dd class="opening-hint" id="openingHint"></dd>
      </dl>
    </main>
    <div class="primary-foot">
      <button class="primary-action" id="openProfile" type="button">查看异常记录</button>
      <p>约 3 分钟 · 最多 12 轮</p>
    </div>
  </section>

  <section class="screen profile-screen" id="home">
    <div class="osbar"><span>14:48</span><span class="os-signals" aria-hidden="true"><i></i><i></i><i></i><b></b></span></div>
    <header class="appbar appbar-centered">
      <button class="back-button" id="backOpening" type="button">返回</button>
      <strong>客户档案</strong>
      <span class="quiet">实时</span>
    </header>
    <div class="desk-body">
      <div class="alertbar"><span>资产异动预警</span><b>待处理</b></div>
      <p class="home-note" id="deskNote"></p>
      <div class="ccard">
        <div class="ccard-top">
          <span class="avatar" aria-hidden="true">客</span>
          <span class="ccard-id"><b id="cName"></b><i id="cSub"></i></span>
          <span class="ctag" id="cTag"></span>
        </div>
        <dl class="facts" id="cFacts"></dl>
        <button class="facts-more" id="factsMore" type="button" aria-expanded="false" hidden>
          <span id="factsMoreLabel"></span>
        </button>
      </div>
    </div>
    <div class="deskfoot">
      <button class="deskcta" id="openChen" type="button"><b id="ctaLabel">联系客户</b></button>
    </div>
  </section>

  <section class="screen chat-screen" id="chat">
    <div class="osbar"><span>14:50</span><span class="os-signals" aria-hidden="true"><i></i><i></i><i></i><b></b></span></div>
    <header class="chat-top">
      <div class="chat-name-line">
        <strong id="peer"></strong>
        <span class="chat-mood"><i></i><b id="mood" role="status" aria-live="polite">戒备</b></span>
      </div>
      <div class="turn-line">
        <span>第 <b class="num" id="turnCurrent">1</b> 轮 / <span class="num" id="turnTotal">12</span></span>
        <span class="round-meter" aria-hidden="true"><i id="roundFill"></i></span>
        <span class="legacy-trust-track" hidden><i id="trustFill"></i><i id="trustGoal"></i></span>
        <span id="remaining" hidden>12</span>
      </div>
    </header>
    <main class="thread" id="thread" aria-live="polite" aria-label="对话">
      <p class="strangertip">对方是你的客户。本次内容仅用于模拟训练。</p>
    </main>
    <form class="composer" id="composer" autocomplete="off">
      <div class="inputrow">
        <input id="say" maxlength="120" enterkeyhint="send" aria-label="跟客户说">
        <button id="send" type="submit" aria-label="发送消息">↑</button>
      </div>
      <p>不要提供密码、验证码或要求客户提供敏感信息</p>
    </form>
  </section>
</main>
<script src="static/app.js"></script>
</body>
</html>
